# Example answers for an unattended VM test:
#     bash archbd-install.sh -c archbd-test.conf
# Anything you leave out is asked interactively. Add -n for a dry run first.
# WARNING: ASSUME_YES=y skips the final "type YES" prompt and plaintext
# passwords are stored here. Use this only for throwaway VMs.

HOST_NAME=archvm
USERNAME_=tester
TIMEZONE=Asia/Dhaka
LOCALE=en_US.UTF-8
KEYMAP=us
MIRROR_COUNTRIES=""          # blank = worldwide

DE=xfce                      # xfce gnome kde cinnamon mate lxqt none
FS_TYPE=btrfs                # ext4 btrfs xfs
WANT_APPS=n
WANT_FIREWALL=n

PARTITION_MODE=auto          # auto = wipe INSTALL_DISK, manual = use ROOT_PART etc.
INSTALL_DISK=/dev/sda        # the VM's virtual disk
ENABLE_ZRAM=y
ENABLE_OSPROBER=n

# manual mode only (leave commented out in auto mode):
#ROOT_PART=/dev/sda2
#EFI_PART=/dev/sda1
#FORMAT_EFI=y
#SWAP_PART=""
#HOME_PART=""

ROOT_PASSWORD=test
USER_PASSWORD=test
ASSUME_YES=y
REBOOT=n
