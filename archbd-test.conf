# Example answers for an unattended VM test:
#     bash archbd-install.sh -c archbd-test.conf
# Anything you leave out is asked interactively (dialog menus; add -p for plain prompts).
# Add -n for a dry run first.
# WARNING: ASSUME_YES=y skips the final "type YES" prompt and plaintext
# passwords are stored here. Use this only for throwaway VMs.

HOST_NAME=archvm
USERNAME_=tester
TIMEZONE=Asia/Dhaka
LOCALE=en_US.UTF-8
KEYMAP=us
MIRROR_COUNTRIES="BD,IN,SG"  # nearby countries; "" = worldwide (slower)
# Optional mirror tuning:
#PREFERRED_MIRRORS=("https://mirror.xeonbd.com/archlinux")   # tried first, if reachable and fresh
#MIRROR_SORT=rate            # reflector's slow real speed test (default: score, fast)

DE=xfce                      # xfce gnome kde cinnamon mate lxqt none
FS_TYPE=btrfs                # ext4 btrfs xfs
WANT_APPS=n
WANT_FIREWALL=n

PARTITION_MODE=auto          # auto   = wipe INSTALL_DISK: EFI + root (root gets the rest)
                             # custom = wipe INSTALL_DISK, sizes below
                             # manual = use existing ROOT_PART etc. (see further down)
INSTALL_DISK=/dev/sda        # the VM's virtual disk
ENABLE_ZRAM=y
ENABLE_OSPROBER=n

# custom mode only: sizes like 512M, 4G, 1.5G (1G = 1024M); rest = all that is left;
# none = skip. Anything you leave out is asked interactively.
#ESP_SIZE=512M               # EFI/boot partition (UEFI only)
#SWAP_SIZE=none              # swap partition; none = use zram instead
#ROOT_SIZE=20G               # rest = no separate /home
#HOME_SIZE=rest              # none, a size, or rest

# manual mode only (leave commented out in auto mode):
#ROOT_PART=/dev/sda2
#EFI_PART=/dev/sda1
#FORMAT_EFI=y
#SWAP_PART=""
#HOME_PART=""

ROOT_PASSWORD=test
USER_PASSWORD=test
ASSUME_YES=y
REBOOT=n
